<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="همیار">
  <!--
    Candidate A — «یک سطر» (one row).
    A handset, and inside its screen the one thing the product is about: a row. Every
    device is a line with a history, and the accent dot at the reading start (RTL: the
    right) is that row's state. The row stays inside the frame on purpose — a line that
    crosses the body reads as "no phone", which the first draft did. Two shapes, one
    accent, legible at 16px, and it survives a single-colour print.
  -->
  <rect x="7" y="2.5" width="18" height="27" rx="4.5" stroke="currentColor" stroke-width="2.6"/>
  <path d="M17.5 16H11.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="20.5" cy="16" r="2.3" fill="#0066cc"/>
</svg>
