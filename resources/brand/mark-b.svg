<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="همیار">
  <!--
    Candidate B — the monogram «ه».
    The first letter of همیار, set as two stacked loops with the proportions of a handset:
    the lower loop is the body, the upper the notch. Persian-first — it reads as a letter
    to the audience and as an abstract phone to everyone else. Heavier stroke than A, so it
    holds its own on a navy ground; the accent is the connecting stroke, the "hand" that
    joins the two.
  -->
  <rect x="6" y="12" width="20" height="17.5" rx="6" stroke="currentColor" stroke-width="3"/>
  <rect x="10.5" y="2.5" width="11" height="10" rx="4" stroke="currentColor" stroke-width="3"/>
  <path d="M16 12.5v3" stroke="#0066cc" stroke-width="3" stroke-linecap="round"/>
</svg>
