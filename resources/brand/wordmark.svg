<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2076 234" fill="currentColor" role="img" aria-label="Hamyar">
  <!--
    The logo: HAMYAR, all caps, wide geometric, cut and notched. Aspect 8.87 : 1.

    The owner's commissioned design, delivered as a raster on 2026-09-05 and re-drawn here
    as vectors. It is not a typeface set in caps: the H and M drop their trailing corner to
    a 26-unit round, each A carries its crossbar as a free-standing trapezoid with a gap
    above it, the M meets at points, and the R's counter is a horizontal slot with a round
    cap that cuts clean through the stem. A reader recognises the mark by those.

    Not traced. Every edge was measured off the source PNG — column and row scans of its
    alpha — and lines, arcs and two cubics fitted to the measurements, because a tracer
    gives thousands of noisy points, mush at 16px, and nothing anyone can edit. It overlays
    the source at 99.2% IoU. Two departures, both sub-pixel at any size we use: one A is
    drawn once and placed twice (the source's second is ~2.4% wider — drawing noise, and
    two different A's in one word is a defect), and the mark is squared to its own bounding
    box so cap height and baseline are exactly 0 and 234.

    Contract, relied on by components/brand-mark.tsx and the landing nav: `fill=
    "currentColor"` on the root and NO fill on any path, so one file serves brand blue on
    white, white on navy and ink on a light band; and no width/height, so consumers size it
    by height and the aspect ratio follows.

    Do not hand-edit — re-derive from the owner's artwork. Method: docs/design-system.md.
  -->
