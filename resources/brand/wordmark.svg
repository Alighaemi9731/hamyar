<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -706 4615 706" fill="currentColor" role="img" aria-label="Hamyar">
  <!--
    The logo: HAMYAR, all caps, geometric, tracked +46/1000em.

    Drawn from Outfit Bold (SIL Open Font License 1.1; the source face is committed beside
    this file) and converted to outlines, so it renders identically everywhere, needs no
    webfont to have loaded, and cannot reflow. It inherits `currentColor`: brand blue on
    white, white on the navy band, ink where the ground is light.

    Why a geometric face rather than the product's own text face: a logotype is read as a
    shape, and IBM Plex — a humanist grotesque — draws letters that are excellent in a
    paragraph and unremarkable at 6 characters. This is the model the owner asked for.

    An earlier draft cut a diagonal slot through the first two letters, echoing the
    reference's own device. The reference cuts the free ends of a C and an E; HAMYAR has
    no such terminal, so the slot fell through the middle of the H and the A and left
    floating shards. Deleted rather than tuned.

    GENERATED. Regenerate with the command in docs/design-system.md; do not hand-edit.
  -->
