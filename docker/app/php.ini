; MobiShop — development PHP settings.
; Production overrides live in docker/app/php.prod.ini (Phase 11).

memory_limit = 512M
max_execution_time = 120

; Uploads: device photos, ID scans, Excel imports.
upload_max_filesize = 32M
post_max_size = 40M

; Storage is always UTC — Jalali/Tehran rendering happens in the app layer only.
date.timezone = UTC

; Iranian shop names, Persian product titles: keep multibyte handling explicit.
default_charset = "UTF-8"

; Dev: show everything, cache nothing.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
