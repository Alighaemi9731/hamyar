; Hamyar — production PHP settings.
;
; Installed as `zz-hamyar-prod.ini` so it loads AFTER `99-hamyar.ini` and every
; setting here overrides the development value of the same name. The dev file is left
; intact rather than duplicated, so the two cannot drift on the settings they share —
; upload limits, timezone, charset.
;
; The `zz-` prefix is load-bearing. PHP scans conf.d alphabetically and the last file
; wins; the first version of this file was `99-hamyar-prod.ini`, which sorts BEFORE
; `99-hamyar.ini` (`-` is 0x2D, `.` is 0x2E). Every override below was silently
; discarded, and the built image really did run with `opcache.validate_timestamps = On`
; and `display_errors = STDOUT`. Found by inspecting the image rather than by reading
; the Dockerfile, which is the only way this kind of thing is ever found.

; --- errors ------------------------------------------------------------------
; Never to the browser. A stack trace on a 500 names file paths, package versions and
; often a query with its bindings; on a shop's screen it is both a disclosure and a
; message no shopkeeper can act on. Sentry gets the detail, the operator gets a page.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- opcache -----------------------------------------------------------------
; The single largest performance difference between this file and the dev one.
opcache.enable = 1
opcache.enable_cli = 0

; The important line. In dev the cache re-stats every file on every request so an edit
; is visible immediately; here the code cannot change without a new container, so
; checking is pure cost on every include of every request.
;
; It is also why `bin/deploy` swaps containers rather than pulling code into a running
; one: with timestamp validation off, changing a file underneath PHP does nothing at
; all — the old bytecode keeps serving, and the deploy silently has no effect.
opcache.validate_timestamps = 0

; Filament, Inertia, eighteen module providers and their vendor trees. The default
; 10000 files / 128MB is comfortably exceeded, and an overflowing opcache silently
; stops caching rather than reporting anything.
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000

; No revalidation and no timestamps, so the comment cache is safe to drop too.
opcache.save_comments = 1
opcache.fast_shutdown = 1

; --- realpath ----------------------------------------------------------------
; Same reasoning as opcache: the file tree is immutable for the life of the container,
; so resolved paths never need re-checking.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; --- limits ------------------------------------------------------------------
; Lower than dev's 512M on purpose. A request that needs more than this is a report
; someone should be paginating or queueing, and the process limit is what turns that
; into one failed request instead of an OOM that takes the container's siblings with it.
memory_limit = 256M
max_execution_time = 60

; --- hardening ---------------------------------------------------------------
expose_php = Off
