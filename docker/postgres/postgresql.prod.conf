# Hamyar — production Postgres 16.
#
# Mounted read-only at /etc/postgresql/postgresql.conf and selected with
# `-c config_file=`, which REPLACES the image's generated config rather than appending
# to it — so anything the image would normally set has to be set here. The connection
# settings below are the ones that matter for that.
#
# Tuned for a single well-specified VPS (docs/deploy.md §2): the whole platform,
# 50 shops, ~19M rows and 5.5GB measured on the 11.2 fixture. Sized against 8GB of RAM;
# the four memory lines are the ones to revisit on a bigger box, and nothing else here
# depends on them.

# ------------------------------------------------------------- connections ----
listen_addresses = '*'          # The compose network only — no port is published.
max_connections = 120
                                # PHP-FPM children + Horizon workers + the scheduler,
                                # with room for a psql session during an incident. Each
                                # idle connection costs ~10MB, so this is not free.

# ------------------------------------------------------------------ memory ----
shared_buffers = 2GB            # ~25% of RAM, the standard starting point.
effective_cache_size = 6GB      # What the planner assumes the OS is caching. An
                                # under-estimate here makes it prefer sequential scans,
                                # which is exactly wrong for the tenant-scoped index
                                # lookups every query in this product is.
work_mem = 16MB                 # Per sort/hash node, not per query — a report with
                                # four of them uses four times this, per connection.
maintenance_work_mem = 512MB    # Index builds and VACUUM.

# --------------------------------------------------------------------- wal ----
#
# `replica` rather than `minimal` because archiving requires it. This is the setting
# that makes point-in-time recovery possible at all: with `minimal` the WAL does not
# contain enough to replay, and the mistake is only discovered during a restore.
wal_level = replica
archive_mode = on

# Archive to a local volume, then bin/backup-nightly ships it offsite. Two levels for
# two different disasters: the local archive recovers a bad migration or a dropped
# table to the second, the offsite copy survives losing the machine.
#
# `test ! -f` first: the archiver may retry a file it already archived, and overwriting
# an existing WAL segment silently corrupts the archive. Postgres treats a non-zero
# exit as "retry later", which is the correct behaviour when the disk is full — it
# stops and complains rather than losing the segment.
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && gzip -c %p > /var/lib/postgresql/wal_archive/%f.tmp && mv /var/lib/postgresql/wal_archive/%f.tmp /var/lib/postgresql/wal_archive/%f'
archive_timeout = 300           # Force a segment every 5 minutes even when idle, so
                                # the recovery window is bounded by time and not by
                                # write volume. A quiet Friday night must not mean
                                # "recoverable to Friday lunchtime".

max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9

# -------------------------------------------------------------- autovacuum ----
autovacuum = on
# `stock_movements` and `ledger_entries` are append-only ledgers (golden rule 3) and
# grow without bound; `sessions` and `sms_messages` churn hard. Default thresholds
# (20% of a table) mean a 5M-row table waits for a million dead rows.
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_max_workers = 4
autovacuum_naptime = 30s

# ------------------------------------------------------------------ planner ----
random_page_cost = 1.1          # SSD. The default of 4.0 assumes a spinning disk and
                                # pushes the planner off exactly the index scans the
                                # 11.2 measurements confirmed it should be choosing.
effective_io_concurrency = 200

# ------------------------------------------------------------------ logging ----
log_destination = 'stderr'      # Collected by Docker's json-file driver (compose.prod).
logging_collector = off
log_min_duration_statement = 300ms
                                # The roadmap's own alert threshold (docs/deploy.md §4).
log_checkpoints = on
log_connections = off           # One line per request at this connection count.
log_lock_waits = on             # Tenant deletion is a lock-heavy multi-minute cascade
                                # (roadmap 11.3) — when it blocks, this is the record.
log_temp_files = 0              # Any spill to disk means work_mem is too small for a
                                # query somebody should look at.
log_timezone = 'UTC'            # Golden rule 5: stored time is UTC, everywhere.
timezone = 'UTC'

# ---------------------------------------------------------------- extensions ----
# Named in docs/deploy.md §4 as the source of the p95 query alert. Loading it needs a
# restart, which is why it is here rather than discovered during an incident.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = top

# ------------------------------------------------------------------- locale ----
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'
                                # Persian is not a bundled configuration. Product and
                                # customer search is LIKE/trigram-based rather than
                                # full-text, so nothing depends on this today; it is
                                # set explicitly so the default is a choice.
