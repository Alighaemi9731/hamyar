# Rewritten by bin/deploy on every release. Checked in with the blue slot so a first
# boot on a fresh box has something valid to read.
#
# Zero-downtime works because this is the ONLY file that changes at cutover: nginx is
# reloaded rather than restarted, so workers serving in-flight requests finish on the
# old upstream while new connections go to the new one.
upstream hamyar_app {
    server app_blue:9000;
}
