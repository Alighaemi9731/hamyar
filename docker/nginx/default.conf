# MobiShop — dev vhost.
#
# Catch-all on purpose: the central app answers on app.localhost and every tenant
# gets its own subdomain (demo.app.localhost). Tenant resolution happens in PHP
# (TenantContext middleware, Phase 1), not here.

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 40M;

    # Vite dev assets are served by the Vite dev server on the host (npm run dev),
    # so nothing here proxies /@vite — the @vite directive emits absolute URLs.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;

        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
