# MobiShop — local development stack.
#
#   make up      start everything
#   make fresh   migrate:fresh --seed (demo tenant)
#   make sh      shell inside the app container
#
# Host entry required for tenant subdomains — see docs/deploy.md#local-hostnames:
#   127.0.0.1  app.localhost demo.app.localhost acme.app.localhost

name: mobishop

services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: mobishop-app:dev
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - composer-cache:/home/mobishop/.composer
    environment:
      COMPOSER_HOME: /home/mobishop/.composer
      PHP_IDE_CONFIG: serverName=mobishop
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # Override with APP_HTTP_PORT=8080 in .env if binding :80 needs privileges.
      - "${APP_HTTP_PORT:-80}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-mobishop}
      POSTGRES_USER: ${DB_USERNAME:-mobishop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      # Row-Level Security is our second line of tenancy defence. The app user must
      # therefore NOT be the table owner or a superuser, since both bypass RLS.
      # docker/postgres/init/ provisions the non-privileged app role.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-mobishop} -d ${DB_DATABASE:-mobishop}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_PORT_HOST:-9000}:9000"
      - "${MINIO_CONSOLE_PORT_HOST:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-mobishop}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-mobishop-secret}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: creates the tenant media bucket so `make up` is enough to have working uploads.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-mobishop} ${AWS_SECRET_ACCESS_KEY:-mobishop-secret} &&
      mc mb --ignore-existing local/${AWS_BUCKET:-mobishop} &&
      mc anonymous set none local/${AWS_BUCKET:-mobishop}
      "
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT_HOST:-1025}:1025"
      - "${MAILPIT_UI_PORT_HOST:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  postgres-data:
  redis-data:
  minio-data:
  composer-cache:
