# Hamyar — production stack, single VPS.
#
#   docker compose -f compose.prod.yaml --env-file .env.production up -d
#
# Deploys are driven by bin/deploy, not by editing this file. It is written to be
# boring: one box, named services, no orchestration. Kubernetes is an explicit
# anti-goal (docs/deploy.md §2).
#
# ## Nothing here names a domain, a host or a secret
#
# Every value that differs between "this repository" and "the server it runs on" is an
# environment variable with no default that would work by accident. Pointing this at a
# real box is writing .env.production and running the command above — golden rule 1b
# for the domain, and the same discipline for everything else.
#
# ## The two app services are the deploy mechanism
#
# `app_blue` and `app_green` are the same image with different names. Only one is in
# nginx's upstream at a time; bin/deploy starts the idle one on the new tag,
# health-checks it, rewrites docker/nginx/upstream/app.conf and reloads nginx. Both
# are declared here so `docker compose` knows about them; the idle one simply has no
# traffic.

# Renamed to Hamyar, but this project name is NOT renamed: it is the prefix of every
# running container and every named volume on the box. Changing it would make the next
# deploy create empty `hamyar_pgdata`/`hamyar_minio` volumes instead of finding the live
# ones. Renaming it is a coordinated migration, not an edit.
name: mobishop

x-app: &app
  image: ${APP_IMAGE:?set APP_IMAGE, e.g. ghcr.io/you/hamyar-app:9f2c1ab}
  restart: unless-stopped
  env_file: [.env.production]
  # Named rather than bind-mounted: the image already contains the code, and a
  # bind-mount over /var/www/html would replace it with whatever is on the host —
  # which is how a "deploy" ends up serving the previous release from a checkout
  # nobody remembers making.
  volumes:
    - app-storage:/var/www/html/storage
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  logging: &logging
    driver: json-file
    options: {max-size: "20m", max-file: "5"}

services:
  # ------------------------------------------------------------ application ----
  app_blue:
    <<: *app

  app_green:
    <<: *app

  # ------------------------------------------------------------------ nginx ----
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Substituted into docker/nginx/templates/*.template at container start.
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN to the registered apex, with no scheme and no port}
      # Without this filter envsubst also eats nginx's own $uri, $host and
      # $fastcgi_script_name, producing a config that starts and serves nothing
      # correctly. See the template's header.
      NGINX_ENVSUBST_FILTER: '^APP_'
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      # NOT read-only: bin/deploy rewrites app.conf at cutover.
      - ./docker/nginx/upstream:/etc/nginx/upstream
      # Populated by bin/deploy, which copies public/ out of the new image before
      # cutover. NOT a named volume shared with the app containers, and not the image's
      # own directory — neither works:
      #
      #   - nginx's image contains no application, so a named volume mounted here
      #     starts EMPTY and Docker never populates it from a different service's image.
      #   - a volume populated once, on first boot, is populated with the FIRST
      #     release's assets and silently never updated again. Every deploy after that
      #     serves last year's JavaScript with this year's HTML, and the only symptom
      #     is a 404 on a fingerprinted filename.
      #
      # Copying is also what makes the blue/green overlap safe: Vite fingerprints
      # filenames, so `bin/deploy` adds the new release's assets beside the old ones
      # rather than replacing them. During the seconds both containers are live, a page
      # already served by the old one can still fetch the files it references.
      - ./release/public:/var/www/html/public:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    # nginx caches the certificate it read at start-up, so a renewal on disk changes
    # nothing about what is actually served until the master process is reloaded — and
    # NOTHING reloaded it. certbot's --deploy-hook touched /etc/letsencrypt/.renewed and
    # no process anywhere read that file, so the sequence was: certbot renews, reports
    # success, the files on disk are valid, every check that inspects the FILE is green,
    # and sixty days later the certificate nginx is still holding expires and takes every
    # tenant offline simultaneously. Only a probe of the served TLS handshake would have
    # seen it coming.
    #
    # The reload is unconditional and periodic rather than triggered by the flag file,
    # because /etc/letsencrypt is mounted read-only here: this container can see the flag
    # but cannot clear it, so a "reload if the flag exists" loop reloads forever after the
    # first renewal. A graceful reload is what nginx does for log rotation anyway — it
    # costs nothing, it drops no connection, and having no state is what makes it correct
    # every time instead of correct until the flag handling drifts.
    #
    # The re-entrant call to /docker-entrypoint.sh is NOT redundant, and leaving it out
    # is a silent, total failure. The image's entrypoint runs its /docker-entrypoint.d
    # scripts — the envsubst pass over /etc/nginx/templates among them — only when its
    # FIRST ARGUMENT is literally `nginx`:
    #
    #     if [ "$$1" = "nginx" ] || [ "$$1" = "nginx-debug" ]; then ... fi
    #     exec "$$@"
    #
    # A command starting with `/bin/sh` therefore skips substitution altogether and nginx
    # starts on a template with a literal ${APP_DOMAIN} in server_name and in the
    # ssl_certificate paths — the exact failure NGINX_ENVSUBST_FILTER above is documented
    # against, reached by a different door. Calling the entrypoint again with `nginx` as
    # $$1 puts the substitution back.
    command: ["/bin/sh", "-c", "(while :; do sleep 6h; nginx -s reload 2>/dev/null || true; done) & exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    depends_on: [app_blue]
    logging: *logging

  # ------------------------------------------------------------------ queue ----
  horizon:
    <<: *app
    # Horizon supervises its own workers (config/horizon.php); this is the one
    # process that starts them.
    command: ["php", "artisan", "horizon"]
    # `horizon:terminate` is a graceful stop — it lets the running job finish. The
    # default SIGTERM grace of 10s is shorter than a Moadian submission's 180s
    # timeout, so a redeploy mid-submission would kill it.
    stop_grace_period: 200s
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # -------------------------------------------------------------- scheduler ----
  scheduler:
    <<: *app
    # `schedule:work` rather than a host crontab: the schedule lives in
    # routes/console.php, so it ships and rolls back with the code.
    command: ["php", "artisan", "schedule:work"]

  # --------------------------------------------------------------- postgres ----
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # No published port. The database is reachable only on the compose network;
    # `docker compose exec` and the SSH tunnel are the ways in. A Postgres on a public
    # IP is found by scanners within hours.
    environment:
      POSTGRES_DB: ${DB_DATABASE:?}
      # Superuser. NOT what the application connects as — superusers bypass RLS
      # unconditionally, which would silently remove the tenancy guarantee (ADR 0002).
      POSTGRES_USER: ${DB_ROOT_USERNAME:?}
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:?}
      APP_DB_USER: ${DB_USERNAME:?}
      APP_DB_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    # The archive directory is a NAMED VOLUME, so Docker creates its mount point
    # root-owned — and postgres runs as `postgres`. Every archive_command therefore
    # failed with "Permission denied" from the moment the volume was created.
    #
    # Postgres does not treat that as fatal, which is the entire problem. It retries
    # forever, serves every query normally, and reports the failure only in
    # `pg_stat_archiver.failed_count` and a log line. Two things are silently true
    # meanwhile:
    #
    #   1. There is NO point-in-time recovery. The WAL archive that §4 of the runbook
    #      describes as recovering a bad migration "to the second" is empty.
    #   2. Disk fills without bound. A segment that has not been archived cannot be
    #      recycled, so pg_wal grows forever — measured at 14.5GB across 927 segments
    #      on this box after one day — until the disk is full and postgres stops
    #      accepting writes. The platform goes down for a reason nothing pointed at.
    #
    # The entrypoint is wrapped rather than the ownership being set in an init script,
    # because /docker-entrypoint-initdb.d runs as postgres (it cannot chown) and only
    # on first initialisation (it would not repair an existing volume). This runs as
    # root on every start, is idempotent, and then hands off unchanged.
    entrypoint: ["/bin/sh", "-c", "mkdir -p /var/lib/postgresql/wal_archive && chown postgres:postgres /var/lib/postgresql/wal_archive && exec docker-entrypoint.sh \"$$@\"", "--"]
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/postgresql.prod.conf:/etc/postgresql/postgresql.conf:ro
      # WAL archive destination. A local volume is point-in-time recovery for a
      # corrupted table or a bad migration; bin/backup-nightly is what survives losing
      # the machine. Both, because they fail in different directions.
      - wal-archive:/var/lib/postgresql/wal_archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ROOT_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *logging

  # ------------------------------------------------------------------ redis ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Persistent, and that is a decision rather than a default. Redis holds the queue:
    # losing it loses every SMS, every Moadian submission and every import that had
    # not started yet — work a shop believes it has already asked for.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    logging: *logging

  # ---------------------------------------------------------------- certbot ----
  #
  # Wildcard issuance requires DNS-01, so this needs API credentials for the DNS
  # provider rather than a webroot. The plugin is chosen per provider at deploy time —
  # see docs/deploy.md; `certbot/conf` is shared read-only with nginx above.
  certbot:
    # NOT certbot/certbot — that image contains no DNS plugins, so a wildcard renewal
    # dies with "Could not select or initialize the requested authenticator
    # dns-cloudflare" on every attempt. The plugin ships in a per-provider image
    # (certbot/dns-cloudflare, certbot/dns-route53, …), so which one is correct depends
    # on the registrar and therefore belongs in .env.production beside APP_DOMAIN rather
    # than hardcoded here. The default is the plugin-less image because a webroot/HTTP-01
    # setup genuinely wants it, and a wrong default that fails loudly at issuance beats
    # one that fails quietly at renewal.
    image: ${CERTBOT_IMAGE:-certbot/certbot:latest}
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      # DNS provider API credentials, mounted only here. Kept OUT of ./certbot/conf on
      # purpose: that directory is mounted into nginx as well, and a token that can edit
      # the zone's DNS has no business being readable by the internet-facing container.
      # certbot records this path in the renewal config, so it must be the same path at
      # renewal as at issuance — which it is, because only this service mounts it.
      - ./certbot/secrets:/secrets:ro
    # Twice a day is Let's Encrypt's own recommendation: renewal is a no-op until the
    # certificate is inside its window, and an expired wildcard takes EVERY tenant
    # offline simultaneously.
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do certbot renew --quiet --deploy-hook 'touch /etc/letsencrypt/.renewed';
      sleep 12h & wait $${!}; done"
    logging: *logging

volumes:
  postgres-data:
  redis-data:
  wal-archive:
  app-storage:
