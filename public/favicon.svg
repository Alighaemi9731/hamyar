<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Hamyar">
  <!--
    The tab mark: the logo's first letter, from the same outlines, on the brand tile.
    One letter is all a 16px favicon holds — the retired bracket symbol turned to three
    grey smudges at that size. `rx="7"` echoes the product's control radius and keeps the
    tile distinguishable from the round favicons either side of it in a tab strip.
  -->
  <rect width="32" height="32" rx="7" fill="#0066cc"/>
  <path d="M8.448725212464588 24.96V7.039999999999999H12.433767705382436V24.96ZM19.540849858356943 24.96V7.039999999999999H23.551274787535412V24.96ZM10.834674220963173 17.472181303116148V14.020169971671388H20.860736543909347V17.472181303116148Z" fill="#ffffff"/>
</svg>
