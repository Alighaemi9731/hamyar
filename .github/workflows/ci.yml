name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a run be kicked off by hand — useful when re-checking a flaky external
  # dependency without pushing an empty commit.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------- lint ----
  lint:
    name: Style & RTL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - uses: ramsey/composer-install@v3

      # Known-vulnerable PHP packages. Advisories land against versions already in the
      # lockfile, so this fails builds that changed nothing — which is the point: the
      # day an advisory is published is the day we want to hear about it, not the day
      # somebody happens to touch composer.json.
      - name: Composer audit
        run: composer audit --no-interaction

      # Two invocations on purpose, and `composer lint:test` runs the same pair.
      #
      # Pint's results depend on how it is invoked. `pint --test` with no argument misses
      # violations that `pint --test .` catches, and `pint --test .` has itself dropped a
      # finding that a narrower scope reported — same version, same file count, same
      # content. Rather than keep guessing which form is authoritative, run both and fail
      # if either complains. A few seconds of CI beats another red build for a blank line.
      - name: Pint (check only)
        run: |
          ./vendor/bin/pint --test .
          ./vendor/bin/pint --test app config database routes tests bin

      # Golden rule 9. Cheap and fails fast, so it runs before static analysis.
      - name: RTL direction-class gate
        run: php bin/check-direction-classes

      # Three defects this project got wrong once each and one of them three times. All
      # share a shape: nothing crashes, the wrong thing silently wins. Source scans, so
      # they cost seconds and run before anything expensive.
      #
      #   savepoint  — 23505 recovery `try` inside DB::transaction() instead of outside
      #   helpers    — a global helper shadowed by a vendor one (ours never runs)
      #   memo       — forget() on a binding that is not a singleton (every call a no-op)
      - name: Savepoint-recovery gate
        run: php bin/check-savepoint-recovery

      - name: Global-helper collision gate
        run: php bin/check-global-helpers

      - name: Memo-invalidation gate
        run: php bin/check-forgettable-singletons

      # 11a. A queued job runs on a worker that has just finished another shop's job, so
      # "neither tenant-aware nor declared platform-wide" is the one state that must not
      # exist. Enforced rather than remembered.
      - name: Queued-job tenancy gate
        run: php bin/check-queued-tenancy

      # 12.3. usage_counters, tenant_limit_overrides and usage_events are platform-owned:
      # RLS protects them, but they carry no BelongsToTenant, so nothing adds a tenant
      # filter for you. Inside runAsPlatform() an unscoped query returns every shop's rows
      # — on a screen that reads "usage", that is one shop's numbers shown to another.
      - name: Quota-table scoping gate
        run: php bin/check-quota-scoping

      # 11.3. The production apex is not chosen yet, and the five places it surfaces —
      # printed receipts, repair-tracking QR codes, reseller price-list links, SMS
      # templates, emails — are the five nobody greps. A literal there works perfectly
      # until the domain is registered, and the receipts are already in customers'
      # pockets by then.
      #
      # It found one the day it was added: MAIL_FROM_ADDRESS in .env.example was
      # `no-reply@hamyar.ir`, a working name nobody owns.
      - name: Apex-domain gate
        run: php bin/check-apex-domain

      # The tenth occurrence of a rule broken nine times. A form that renders only the keys
      # somebody thought to place answers a refusal on any other key with a 302 and no
      # visible change — the button simply does not work. Ships with a baseline of what was
      # already unprotected, so it fails on anything new and shrinks as pages are rebuilt.
      - name: Form-error gate
        run: php bin/check-form-errors

      - name: Directional arrows are not mirrored
        run: php bin/check-rtl-arrows

      # The landing and the app are two Vite entries that must never import each other
      # (ADR 0016). Since ADR 0020 they share exactly one leaf — resources/css/brand.css,
      # tokens and fonts, importing nothing of either side — and this refuses every other
      # crossing, plus a selector rule sneaking into the leaf itself.
      - name: Bundle-boundary gate
        run: php bin/check-bundle-boundary

  # ----------------------------------------------------------------- stan ----
  static-analysis:
    name: Larastan (level 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

  # ---------------------------------------------------------------- tests ----
  tests:
    name: Pest (PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      # A real Postgres, never SQLite: Row-Level Security is the tenancy guarantee
      # this product sells, and SQLite has no equivalent — a green SQLite suite would
      # prove nothing about isolation (ADR 0002).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hamyar
          POSTGRES_USER: hamyar
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U hamyar"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, pgsql, redis, gd, zip, bcmath, intl, exif, pcntl
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Provision the test database and the non-superuser app role
        # Mirrors docker/postgres/init/. The app role must not be a superuser or RLS
        # is silently bypassed and the isolation suite becomes theatre.
        #
        # CREATEDB is the ONE grant that differs from production, and it is deliberate:
        # `--parallel` has each worker clone the schema into `hamyar_test_test_N`, and
        # without it every worker dies with "permission denied to create database".
        # It does not weaken the guarantee this role exists to prove — **NOBYPASSRLS is
        # what makes the isolation suite real**, and that is untouched. CREATEDB only
        # lets the role make throwaway databases on a throwaway CI Postgres.
        env:
          PGPASSWORD: secret
        run: |
          psql -h 127.0.0.1 -U hamyar -d hamyar -v ON_ERROR_STOP=1 <<'SQL'
            CREATE ROLE hamyar_app LOGIN PASSWORD 'app-secret'
              NOSUPERUSER CREATEDB NOCREATEROLE NOBYPASSRLS;
            CREATE DATABASE hamyar_test OWNER hamyar;
          SQL
          psql -h 127.0.0.1 -U hamyar -d hamyar_test -v ON_ERROR_STOP=1 <<'SQL'
            GRANT CONNECT ON DATABASE hamyar_test TO hamyar_app;
            GRANT USAGE, CREATE ON SCHEMA public TO hamyar_app;
          SQL

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Golden rule 1, verified against the database as it actually is rather than
      # against migration source — so a policy dropped by hand is caught too.
      - name: Tenancy check (RLS + BelongsToTenant + composite indexes)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: hamyar_test
          DB_USERNAME: hamyar_app
          DB_PASSWORD: app-secret
          REDIS_HOST: 127.0.0.1
        run: |
          php artisan migrate:fresh --force
          php artisan tenancy:check

      # `--parallel`, and it is the difference between a 13-minute job and a 4-minute one.
      #
      # The suite is ~1500 tests against a real PostgreSQL, because RLS is the guarantee
      # this product sells and SQLite cannot express it. That costs ~0.35s per test against
      # 0.02s for a test that touches no database — 17x — and it is not negotiable. What IS
      # negotiable is running them one after another on a four-core runner.
      #
      # Each worker gets its own `hamyar_test_test_N` database (hence CREATEDB above), so
      # nothing is shared and no test can see another worker's rows. Process count is left
      # to Pest, which uses the core count: pinning a number here would either waste a
      # bigger runner or overflow a smaller one. Eight processes DID overflow Postgres's
      # shared lock table locally — `migrate:fresh` drops ~100 tables in one transaction —
      # so if this job ever moves to a larger runner, raise `max_locks_per_transaction`
      # before raising the process count.
      - name: Pest
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: hamyar_test
          DB_USERNAME: hamyar_app
          DB_PASSWORD: app-secret
          REDIS_HOST: 127.0.0.1
        run: ./vendor/bin/pest --ci --parallel

      # Runs again on its own so a failure is unambiguous in the checks list: this is
      # the suite that must never be skipped (golden rule 8).
      #
      # `pest --ci` treats an empty run as a failure, which is what we want the moment
      # the first tenant-scoped endpoint exists. Until Phase 1 lands there genuinely
      # are none, so the group is legitimately empty — the guard below emits a visible
      # warning instead of a red check, and turns into a hard gate automatically as
      # soon as the first `isolation()` test is written. It is never silently skipped.
      - name: Cross-tenant isolation suite
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: hamyar_test
          DB_USERNAME: hamyar_app
          DB_PASSWORD: app-secret
          REDIS_HOST: 127.0.0.1
        run: |
          # Look for the group DECLARATION, which is what actually puts a test in the
          # suite. An earlier version grepped for a helper call and matched the
          # helper's own definition, sending it back into the empty-run failure it
          # was meant to avoid.
          if grep -rqE "group\('isolation'\)" tests app/Modules --include='*.php' \
               --exclude=Pest.php; then
            ./vendor/bin/pest --group=isolation --ci
          else
            echo "::warning title=No isolation tests::The cross-tenant isolation group is empty. Expected only until Phase 1 introduces the first tenant-scoped endpoints; after that, an empty group means a test was deleted."
          fi

  # -------------------------------------------------------------- browser ----
  browser:
    name: Browser smoke (Chromium)
    runs-on: ubuntu-latest

    # GitHub's default is six hours. This job's `Install Chromium` step hung once,
    # having taken ~4 minutes on the three runs before it, and would have burned the
    # whole default budget before anybody noticed a check that never came back. Twelve
    # minutes is roughly double the observed worst case.
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hamyar
          POSTGRES_USER: hamyar
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U hamyar"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, pgsql, redis, gd, zip, bcmath, intl, exif, pcntl
          coverage: none

      - uses: ramsey/composer-install@v3

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # The one step this job cannot skip. `tests/Browser` runs against the REAL asset
      # bundle — that is the whole point of it, and `Tests\BrowserTestCase` deliberately
      # does not stub `@vite` out. Without a build the page arrives with its Inertia
      # payload and no script to consume it: a blank body, no JavaScript error, and a
      # failure message about text not being visible that explains nothing.
      - name: Build assets
        run: npm run build

      # The only job with a real build, so the only place this can run. It reads the
      # emitted stylesheets rather than the source: `.glass` declared `backdrop-filter`
      # and a hand-written `-webkit-` twin, the minifier folded the pair into the
      # prefixed form alone, and the frosted chrome shipped as a flat slab for a whole
      # redesign with every reviewer reading a source file that was correct.
      - name: Built-CSS gate
        run: php bin/check-built-css

      # Cached on the resolved Playwright version, because the download is the slow and
      # flaky part — it is ~150MB from a third-party CDN, and it is the step that hung.
      # The key comes from the lockfile so a version bump invalidates it automatically
      # rather than silently reusing the wrong browser.
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The browser itself: a download, no apt-get, no prompt to block on.
      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install chromium

      # Chromium's shared libraries, separately and always — they live in the runner
      # image rather than the cached browser directory, so a cache hit still needs them.
      #
      # Split out and hardened because this is the half that hung, twice, after three
      # clean runs. It shells out to `apt-get`, and an apt-get that meets a
      # configuration prompt waits on stdin **forever** — which is not a slow step, it
      # is a step that never returns. `DEBIAN_FRONTEND=noninteractive` is what stops it
      # asking, and the step timeout is what makes a hang a red check in four minutes
      # rather than a check that silently never comes back.
      - name: Ensure Chromium's system libraries
        timeout-minutes: 4
        env:
          DEBIAN_FRONTEND: noninteractive
        run: npx playwright install-deps chromium

      - name: Provision the test database and the non-superuser app role
        env:
          PGPASSWORD: secret
        run: |
          psql -h 127.0.0.1 -U hamyar -d hamyar -v ON_ERROR_STOP=1 <<'SQL'
            CREATE ROLE hamyar_app LOGIN PASSWORD 'app-secret'
              NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
            CREATE DATABASE hamyar_test OWNER hamyar;
          SQL
          psql -h 127.0.0.1 -U hamyar -d hamyar_test -v ON_ERROR_STOP=1 <<'SQL'
            GRANT CONNECT ON DATABASE hamyar_test TO hamyar_app;
            GRANT USAGE, CREATE ON SCHEMA public TO hamyar_app;
          SQL

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # By path rather than by group: `tests/Browser` is deliberately outside every
      # declared testsuite (see phpunit.xml) so a default `pest` on a machine without a
      # build does not fail, and a path is the one selector that does not depend on
      # remembering to tag a new file.
      - name: Pest (browser)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: hamyar_test
          DB_USERNAME: hamyar_app
          DB_PASSWORD: app-secret
          REDIS_HOST: 127.0.0.1
        run: ./vendor/bin/pest tests/Browser --ci

      # The screenshot Pest writes on a failed assertion is the whole diagnosis for a
      # layout defect, and it lives only on the runner.
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: tests/Browser/Screenshots/
          if-no-files-found: ignore

  # --------------------------------------------------------------- assets ----
  assets:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # `--omit=dev` deliberately: a build-tool advisory is worth knowing about and is
      # not worth a red build on every branch, because it never reaches a shop's
      # browser. What ships is what this checks.
      #
      # It found one the day it was added — a high-severity `nanoid` loop, pulled in
      # through `postcss` by the `shadcn` CLI, which is in `dependencies` rather than
      # `devDependencies` and therefore in the production tree. Fixed by the patch bump;
      # the misplaced CLI is noted in docs/security.md.
      # The registry's advisory endpoint is not part of this repository and goes down on
      # its own schedule: three consecutive runs on 2026-09-04 failed with "audit endpoint
      # returned an error" (a socket hang-up on the bulk-advisory call, reproducible from
      # a laptop) while the lockfile was unchanged and clean. So the step retries, and
      # separates "the service could not answer" from "the service answered and found
      # something": the first is a warning, the second still fails the build. A gate that
      # goes red on somebody else's outage is a gate somebody eventually disables.
      - name: npm audit (production tree)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm audit --omit=dev --audit-level=high 2>&1 | tee audit.log; then
              exit 0
            fi
            if ! grep -q "audit endpoint returned an error" audit.log; then
              echo "::error::npm audit found an advisory at or above high severity in the production tree."
              exit 1
            fi
            echo "audit endpoint unavailable (attempt ${attempt}/3); retrying in 20s"
            sleep 20
          done
          echo "::warning::npm audit skipped — the registry's advisory endpoint did not answer after three attempts. Re-run the job later; this is not a finding."

      # Formatting was the one frontend rule with a script and no gate, and it drifted:
      # 25 files across 9 modules were unformatted when this step was added, none of them
      # by anyone's decision. `npm run format` has existed since the design system did;
      # `docs/design-system.md` has referenced a `format:check` that did not exist.
      #
      # It runs here rather than in `lint` because this is the job that already has
      # `npm ci` — a second Node setup to check whitespace is not worth ninety seconds.
      # Before TypeScript, because it is the faster of the two and fails on cheaper input.
      - name: Prettier (check only)
        run: npm run format:check

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Vite build
        run: npm run build
